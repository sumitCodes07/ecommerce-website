<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumit Store</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<header>

<div class="logo">
🛒 Sumit Store
</div>

<div class="search-box">
<input
type="text"
id="searchInput"
placeholder="Search smartphones, laptops, accessories..."
>
</div>

<div class="cart-btn" onclick="toggleCart()">
<i class="fas fa-shopping-cart"></i>
<span id="cartCount">0</span>
</div>

</header>

<section class="hero">

<div class="hero-content">

<h1>Welcome to Sumit Store</h1>

<p>
Premium Smartphones, Laptops & Accessories
</p>

<p>
Fast Delivery • Best Prices • Secure Shopping
</p>

</div>

</section>

<div class="category-buttons">

<button onclick="filterCategory('All')">
All Products
</button>

<button onclick="filterCategory('Smartphones')">
📱 Smartphones
</button>

<button onclick="filterCategory('Laptops')">
💻 Laptops
</button>

<button onclick="filterCategory('Accessories')">
🎧 Accessories
</button>

</div>

<section class="products" id="productContainer">
</section>

<div class="cart-sidebar" id="cartSidebar">

<div class="cart-header">

<h2>Your Cart</h2>

<button onclick="toggleCart()">
✖
</button>

</div>

<div id="cartItems">
</div>

<div class="cart-footer">

<h3>
Total: ₹<span id="totalPrice">0</span>
</h3>

</div>

</div>

<footer>

<div class="footer-content">

<h3>Sumit Store</h3>

<p>
Your One Stop Shop For Electronics
</p>

<p>
© 2026 Sumit Store | Developed by Sumit Bhoi
</p>

</div>

</footer>

<script src="script.js"></script>

</body>
</html>
